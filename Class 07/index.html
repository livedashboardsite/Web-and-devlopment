<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prathamesh Thakur</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #afa4dd;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        #personal {
            background-color: #0A0A0A;
            padding: 40px 20px;
            border-radius: 14px;
            border: 3px solid #E8FF3D;
            cursor: pointer;
            box-shadow: 0 0 0 rgba(232, 255, 61, 0);
            transform: scale(1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #personal:hover {
            transform: scale(1.03) translateY(-6px);
            box-shadow: 0 12px 40px rgba(232, 255, 61, 0.35),
                        0 0 0 3px #E8FF3D inset;
            border-radius: 18px;
        }

        #full {
            color: #ffffff;
            position: relative;
            overflow: hidden;
            padding: 50px 40px;
            border: 2px solid #333;
            border-radius: 10px;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            text-align: center;
            transition: all 0.35s ease-in-out;
        }

        #full::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg,
                transparent 30%,
                rgba(232, 255, 61, 0.08) 50%,
                transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.8s ease;
            pointer-events: none;
        }

        #full:hover::before {
            transform: translateX(100%);
        }

        #full:hover {
            background-color: #1a0505;
            border-color: #E8FF3D;
            transform: rotate(-0.5deg);
        }

        #full h3 {
            margin: 0 0 10px 0;
            font-size: 28px;
            letter-spacing: 3px;
            color: #E8FF3D;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        #full:hover h3 {
            letter-spacing: 6px;
            text-shadow: 0 0 10px rgba(232, 255, 61, 0.8),
                         0 0 30px rgba(232, 255, 61, 0.4);
            transform: scale(1.05);
        }

        #full p {
            margin: 0;
            font-size: 16px;
            color: #aaaaaa;
            letter-spacing: 1px;
            transition: all 0.3s ease 0.1s;
            position: relative;
            z-index: 1;
        }

        #full:hover p {
            color: #ffffff;
            letter-spacing: 3px;
        }

        #training {
            color: rgb(139, 221, 130);
        }

        #course {
            color: rgb(252, 160, 255);
        }
    </style>
</head>
<body>
    <div id="personal">
        <div id="full">
            <h3>&#9733; PRATHAMESH THAKUR &#9733;</h3>
            <p>Web Developer &bull; Designer &bull; Creator</p>
        </div>
    </div>
</body>
</html>
