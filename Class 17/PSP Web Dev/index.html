<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Test Drive - List Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="list-container">
        <!-- Item 1 -->
        <div class="list-item">
            <div class="left-accent"></div>
            <div class="item-content">
                <span class="icon icon-calendar"></span>
                <span class="item-text">book a test drive</span>
            </div>
        </div>

        <!-- Item 2 -->
        <div class="list-item">
            <div class="left-accent"></div>
            <div class="item-content">
                <span class="icon icon-checked"></span>
                <span class="item-text">book a test Coffe</span>
            </div>
        </div>

        <!-- Item 3 -->
        <div class="list-item">
            <div class="left-accent"></div>
            <div class="item-content">
                <span class="icon icon-calendar"></span>
                <span class="item-text">book a test Tea</span>
            </div>
        </div>

        <!-- Item 4 -->
        <div class="list-item">
            <div class="left-accent"></div>
            <div class="item-content">
                <span class="icon icon-calendar"></span>
                <span class="item-text">book a test Biscuit</span>
            </div>
        </div>

        <!-- Item 5 -->
        <div class="list-item">
            <div class="left-accent"></div>
            <div class="item-content">
                <span class="icon icon-calendar"></span>
                <span class="item-text">book a test Mango</span>
            </div>
        </div>
    </div>
</body>
</html>
