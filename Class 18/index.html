<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Moments</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0A0A;
            color: #fff;
            font-family: sans-serif;
            padding: 40px;
        }zzZ
        h1 { font-size: 48px; margin: 8px 0 4px; }
        .sub { color: #999; margin-bottom: 40px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-auto-rows: 100px;
            gap: 6px;
        }

        .cell {
            position: relative;
            overflow: hidden;
        }
        .cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: .4s ease;
            border-radius: 10px;
        }

        .cell .label {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            padding: 8px;
            opacity: 0;
            transition: .4s ease;
            pointer-events: none;
        }

        .cell:hover img {
            filter: blur(1px) brightness(.6);
            transform: scale(1.05);
        }
        .cell:hover .label {
            opacity: 1;
        }

        .c1 { grid-column: span 2; grid-row: span 2; }
        .c2 { grid-column: span 1; grid-row: span 2; }
        .c3 { grid-column: span 2; grid-row: span 3; }
        .c4 { grid-column: span 3; grid-row: span 2; }
        .c5 { grid-column: span 1; grid-row: span 2; }
        .c6 { grid-column: span 2; grid-row: span 2; }
        .c7 { grid-column: span 2; grid-row: span 3; }
        .c8 { grid-column: span 1; grid-row: span 1; }
        .c9 { grid-column: span 1; grid-row: span 3; }
        .c10 { grid-column: span 2; grid-row: span 2; }
    </style>
</head>
<body>

    <p>MY COLLECTIONS</p>
    <h1>Moments</h1>
    <p class="sub">A collection of places, people and memories.</p>

    <div class="grid">
        <div class="cell c1"><img src="https://picsum.photos/id/1015/600/400" alt="Mountain River"><div class="label">Mountain River</div></div>
        <div class="cell c2"><img src="https://picsum.photos/id/1005/300/400" alt="Quiet Portrait"><div class="label">Quiet Portrait</div></div>
        <div class="cell c3"><img src="https://picsum.photos/id/1027/400/600" alt="Summer Laughs"><div class="label">Summer Laughs</div></div>
        <div class="cell c4"><img src="https://picsum.photos/id/1018/700/400" alt="Mountain Lake"><div class="label">Mountain Lake</div></div>
        <div class="cell c5"><img src="https://picsum.photos/id/1025/300/400" alt="Old Friend"><div class="label">Old Friend</div></div>
        <div class="cell c6"><img src="https://picsum.photos/id/1062/400/400" alt="Quiet Woods"><div class="label">Quiet Woods</div></div>
        <div class="cell c7"><img src="https://picsum.photos/id/1040/500/600" alt="That Night"><div class="label">That Night</div></div>
        <div class="cell c8"><img src="https://picsum.photos/id/1039/300/200" alt="Roadside"><div class="label">Roadside</div></div>
        <div class="cell c9"><img src="https://picsum.photos/id/1020/300/600" alt="Quiet Hours"><div class="label">Quiet Hours</div></div>
        <div class="cell c10"><img src="https://picsum.photos/id/1084/500/400" alt="Salt & Air"><div class="label">Salt & Air</div></div>
    </div>

</body>
</html>
