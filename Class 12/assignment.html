<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Home - Find Your Perfect Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon"></span>
                <h1>Dream Home</h1>
            </div>
            <ul class="nav-links">
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">Properties</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <div class="property-card">
            <div class="property-image">
                <img src="https://hips.hearstapps.com/hmg-prod/images/edc100123egan-002-6500742f5feb7.jpg?crop=0.9136xw:1xh;center,top&resize=1200:*" alt="Modern House">
                <div class="for-sale-badge">FOR SALE</div>
                <div class="favourite-btn"></div>
                <div class="price-tag">50 Lakhs</div>
            </div>

            <div class="property-details">
                <h2 class="property-title">Beautiful 2BHK House</h2>
                <div class="property-location">
                    <span class="icon"></span>
                    Pune, Maharashtra
                </div>
                <div class="property-features">
                    <div class="feature">
                        <span class="feature-icon"></span>
                        <span>2 Bedrooms</span>
                    </div>
                    <div class="feature">
                        <span class="feature-icon"></span>
                        <span>2 Bathrooms</span>
                    </div>
                    <div class="feature">
                        <span class="feature-icon"></span>
                        <span>1200 sq.ft.</span>
                    </div>
                </div>
                <button class="view-details-btn">View Details</button>
            </div>
        </div>
    </main>
</body>
</html>
