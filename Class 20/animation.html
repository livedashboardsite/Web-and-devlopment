<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation of popup</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #f4f4f4;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
    }

.menu {
    background: #f8f8f8;
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    overflow: hidden;
}

.item {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 80px;            
    height: 80px;
    padding: 0 24px;
    color: #111;
    border-bottom: 1px solid #e6e6e6;
    overflow: hidden;
    white-space: nowrap;
    cursor: pointer;
    transition: width 0.35s ease;
}

.item:last-child {
    border-bottom: none;
}

.icon {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
}

.icon svg {
    width: 100%;
    height: 100%;
}

.label {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
}

.item:hover {
    width: 320px;
}
    </style>

<body>
    <h1>Animation of popup</h1>
    <p>Hover over an icon to slide in its content. Four icons in a list &mdash; hovering one icon slides its label open horizontally; hovering another slides its own content.</p>

    <div class="menu">
        <div class="item">
            <div class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"/>
                    <circle cx="12" cy="12" r="2"/>
                    <path d="M12 14v7"/>
                    <path d="M5 10l4 2"/>
                    <path d="M19 10l-4 2"/>
                </svg>
            </div>
            <span class="label">BOOK A TEST DRIVE</span>
        </div>
        <div class="item">
            <div class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 13l2-5a2 2 0 0 1 2-1.5h8A2 2 0 0 1 17 8l2 5"/>
                    <path d="M3 13h16v4H3z"/>
                    <circle cx="7" cy="17" r="1.5"/>
                    <circle cx="17" cy="17" r="1.5"/>
                    <path d="M19 3v4M17 5h4"/>
                </svg>
            </div>
            <span class="label">BUILD YOUR OWN</span>
        </div>
        <div class="item">
            <div class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 12L12 20 4 12V4h8z"/>
                    <circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/>
                    <path d="M14 8.5h3M14 11.5h3M16 8.5v6"/>
                    <path d="M16 12c0 0-2 .5-2 2s2 1.5 2 2.5"/>
                </svg>
            </div>
            <span class="label">VIEW PRICES</span>
        </div>
        <div class="item">
            <div class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="7" width="18" height="13" rx="1"/>
                    <path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>
                    <path d="M3 12h18"/>
                </svg>
            </div>
            <span class="label">RESERVE ONLINE</span>
        </div>
    </div>
</body>
</html>
