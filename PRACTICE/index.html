<html>
<head>
    <style>
        * {
            box-sizing: border-box;
        }


        .card {
            width: 900px;
            min-height: 600px;
            border: 2px solid #222;
            text-align: center;
            padding: 65px 80px;
        }

        .profile-circle {
            width: 250px;
            height: 250px;
            border: 2px solid #333;
            border-radius: 50%;
            margin: 0 auto 70px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 36px;
            font-weight: 700;
        }

        h2 {
            margin: 0 0 40px;
            font-size: 27px;
            font-weight: 700;
        }

        p {
            max-width: 650px;
            margin: 0 auto;
            font-size: 22px;
            line-height: 1.5;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="profile-circle"></div>

        <h1>John Doe</h1>

        <h2>Web Developer</h2>

        <p>
            A passionate developer with experience in HTML,<br>
            CSS, and JavaScript. Loves to build clean and<br>
            responsive web applications.
        </p>

    </div>

</body>
</html>
