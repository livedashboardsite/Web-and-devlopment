<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
     {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: sans-serif;
}

.navbar {
    background-color: #000000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
}

.logo {
    color: #ffffff;
    font-size: 24px;
    font-weight: bold;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 25px;
}

.nav-right a {
    color: #ffffff;
    text-decoration: none;
    font-size: 16px;
}

.nav-right a:hover {
    color: #E8FF3D;
}

.login-btn {
    background-color: #E8FF3D;
    color: #000000;
    border: none;
    padding: 8px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login-btn:hover {
    opacity: 0.9;
}
    </style>

<body>
    <nav class="navbar">
        <div class="logo">LOGO</div>    
        <div class="nav-right">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
            <button class="login-btn">Login</button>
        </div>
    </nav>
</body>
</html>
