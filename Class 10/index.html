<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Card Style</title>
</head>
<body>


    <div class="carousel-container">

        <div class="nav-arrow nav-left">&#10094;</div>

        <div class="cards-wrapper">

            <div class="card">
                <div class="card-header">
                    <div class="profile-img">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_XRj4_B-YR9Pze71awq8WfCtGG6li_Rwb4guHPpBI7w&s" alt="Tangiro">
                    </div>
                </div>
                <div class="card-body">
                    <h2 class="card-name">Tangiro</h2>
                    <p class="card-text">
                        TANGIRO IS A ANIME CHARACTER
                    </p>
                    <button class="card-btn">View More</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="profile-img">
                        <img src="https://upload.wikimedia.org/wikipedia/en/2/21/Web_of_Spider-Man_Vol_1_129-1.png?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail_unscaled" alt="Spider man">
                    </div>
                </div>
                <div class="card-body">
                    <h2 class="card-name">Spider man</h2>
                    <p class="card-text">
                        SPIDERMAN IS A AVENGER
                    </p>
                    <button class="card-btn">View More</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="profile-img">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDmBIzMYbYUswDgY8PWd85z1EuhheqVxhtJZrHstwrdyrYGxv5oVzuDVNxDWtIzFVkb1l8&s=10" alt="Doremon">
                    </div>
                </div>
                <div class="card-body">
                    <h2 class="card-name">Doremon</h2>
                    <p class="card-text">
                        A ROBOT FROM 2090 </p>
                    <button class="card-btn">View More</button>
                </div>
            </div>

        </div>

        <div class="nav-arrow nav-right">&#10095;</div>

    </div>

    <div class="carousel-dots">
        <span class="dot dot-active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

</body>
</html>
