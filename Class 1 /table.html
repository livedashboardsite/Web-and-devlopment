<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="5" cellspacing="0" cellpadding="10">
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Age</th>
            <th>Branch</th>
        </tr>
        <tr>
            <td>Prathamesh</td>
            <td>Thakur</td>
            <td>17</td>
            <td colspan="2">CSE AI </td>
        </tr>
        <tr>
            <td>Viren</td>
            <td>Patel</td>
            <td>20</td>
            <td colspan="4" rowspan="2">CSE AI </td>
        </tr>
        <tr>
            <td>Mohit</td>
            <td>Sharma</td>
            <td>18</td>
            <td colspan="2" rowspan="2">CSE AI </td>
        </tr>
        <tr>
            <td>Deepanshu</td>
            <td>Tiwari</td>
            <td>18</td>
            <td colspan="2" rowspan="2" align="center">CSE AI </td>
        </tr>
    </table>
</body>
</html>
