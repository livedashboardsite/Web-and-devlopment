<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
</head>
<style>
    #div1 {
        width: 200px;
        height: 200px;
        background-color: red;
        margin: 0 auto;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
    }
    @media screen and (max-width: 600px) {
        #div1 {
            background-color: blue;
            width: 100px;
            height: 100px;
            border-radius: 15%;
        }
    }
    @media screen and (max-width: 400px) {
        #div1 {
            background-color: green;
            width: 50px;
            height: 50px;
            border-radius: 30%;
        }
    }

    @media screen and (max-width: 300px) {
        #h1 {
            font-size: 20px;
            font-weight: bold;
            color: red;
            text-align: center;
        }
    }
</style>

<body>
    <h1>Media Queries</h1>
    <p>Experimenting media queries on a div element make color change on the screen size.</p>
    <div id="div1"></div>

    
</body>
</html>
