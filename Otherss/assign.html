<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
    }
    div {
        width: 200px;
        height: 200px;
        border: 1px solid #000;
        position: fixed;
        box-sizing: border-box;
    }
    #one {
        background-color: red;
        top: 20px;
        left: 20px;
        border-radius: 50%; 
    }
    #two {
        background-color: green;
        top: 20px;
        right: 20px;
    }
    #three {
        background-color: blue;
        bottom: 20px;
        left: 20px;
    }
    #four {
        background-color: yellow;
        bottom: 20px;
        right: 20px;
    }
    #five {
        background-color: pink;
        top: 50%;
        left: 50%;
        width: 100px;
        height: 100px;
        transform: translate(-50%, -50%);
    }
</style>
<body>
    <div id="one"></div>
    <div id="two"></div>
    <div id="three"></div>
    <div id="four"></div>
    <div id="five"></div>

</body>
</html>
