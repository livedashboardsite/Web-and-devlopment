<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>School Championship Registration Form</h1>
    <form action="/action_page.php">
        <fieldset>
            <legend><i>Details Required:</i></legend>
            <label type="text">School Name:</label>
            <input type="text" id="schoolName" name="schoolName"><br><br>
            <label for="fname">First name:</label>
            <input type="text" id="fname" name="fname"><br><br>   
            <label for="lname">Last name:</label>
            <input type="text" id="lname" name="lname"><br><br>
            <label for="ParentName">Parent Name:</label>
            <input type="text" id="ParentName" name="ParentName"><br><br>
            <label for="parentPhone">Parent Phone:</label>
            <input type="text" id="parentPhone" name="parentPhone"><br><br>
            <label for="parentEmail">Parent Email:</label>
            <input type="text" id="parentEmail" name="parentEmail"><br><br>
            <label for="PreferedSpot">Prefered Spot:</label>
            <input type="text" id="PreferedSpot" name="PreferedSpot"><br><br>
            <input type="checkbox" id="notRobot" name="robot" value="notRobot">
            <label for="notRobot">I am not a Robot</label><br><br>
            <textarea cols="30" rows="10" id="message" name="message"></textarea><br><br>
            <Select>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </Select><br><br>
            <label for="Submit">Submit:</label>
            <input type="submit" id="Submit" name="Submit"><br><br>
            <button type="submit">Submit</button>
        </fieldset>
    </form>
</body>
</html>
