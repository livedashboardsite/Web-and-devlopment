<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images Changing Animation</title>
</head>


<body>
<h1>Images Changing Animation</h1>
<p> Images Changing animation every 1 sec multiple images in a loop chaning at every 2 sec of interval.</p>
<img height="500px" src="" />


<script>
let arr = ["https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/001.png","https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/006.png","https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/008.png","https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/025.png","https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/026.png","https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/027.png","https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/028.png","https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/016.png","https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/017.png",""]
let img = document.querySelector("img");
let n = 0
 setInterval(() => {
    img.setAttribute("src", arr[n]);
    n=(n+1)%arr.length;
 }, 2000);



    
    </script>




    
</body>
</html>
