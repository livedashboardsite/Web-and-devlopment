<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page */
        body {
            background: #252529;
            color: white;
            font-family: Georgia, serif;
            padding: 80px 6%;
            min-height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 45px;
        }

        #sub-title {
            color: #ff776e;
            letter-spacing: 2px;
        }

        #title {
            color: #b8dcff;
            font-size: clamp(28px, 4vw, 58px);
            text-align: right;
            text-shadow: 2px 2px 4px #6a9eff;
        }

        #title span {
            color: #ff624f;
            text-shadow: 2px 2px 4px #b93e2d;
        }

        /* Main Container */
        #container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 380px;
            background: #f56818;
            border-radius: 20px;
            overflow: hidden;
        }

        #container::before {
            content: "01";
            position: absolute;
            top: 25px;
            left: 25px;
            color: white;
            font: 11px monospace;
        }

        /* Portfolio Card */
        .portfolio-card {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 72%;
            min-height: 260px;
            background: #b9d9ff;
            color: #111d3b;
            border: 2px solid #d5e8ff;
            border-radius: 14px;
            box-shadow: 18px 18px 0 rgba(157, 56, 13, 0.3);
            transform: rotate(-2deg);
            transition: transform 0.3s ease;
        }

        .portfolio-card h2 {
            font-size: 34px;
            font-weight: normal;
        }

        .portfolio-card:hover {
            transform: rotate(0deg) scale(1.02);
        }

        /* Mobile Responsive */
        @media (max-width: 650px) {
            body {
                padding: 35px 5%;
            }

            .header {
                flex-direction: column-reverse;
                align-items: flex-start;
                margin-bottom: 30px;
            }

            #title {
                text-align: left;
            }

            #container {
                min-height: 300px;
            }

            .portfolio-card {
                width: 82%;
                min-height: 200px;
            }

            .portfolio-card h2 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h6 id="sub-title">02 — Selected Work.</h6>

        <h1 id="title">
            Things I've <span>created.</span>
        </h1>
    </header>

    <main id="container">
        <div class="portfolio-card">
            <h2>Portfolio</h2>
        </div>
    </main>

</body>
</html>
