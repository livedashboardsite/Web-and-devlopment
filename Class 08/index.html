<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Assignment</title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    .task2-box {
      background-color: #d1d5db;
      padding: 30px;
      display: inline-block;
      margin-bottom: 40px;
    }
    .btn {
      padding: 10px 24px;
      margin: 0 5px;
      cursor: pointer;
      font-size: 14px;
      border: 1.5px solid #222;
    }
    .btn-rounded {
      background-color: #99ff33;
      border-radius: 12px;
    }
    .btn-oval {
      background-color: #b336ff;
      border-radius: 50px / 25px;
    }
    .btn-circle {
      background-color: #1abc9c;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      padding: 0;
    }
    .btn-rect {
      background-color: #8db600;
    }
  </style>
</head>
<body>

  <h2>first task---- create using external css</h2>
  <div class="task1-wrapper">
    <div class="task1-white-card">
      <div class="task1-red-card">
        <img src="https://picsum.photos/300/200" alt="Landscape" class="task1-img">
        <div class="task1-shadow-block"></div>
      </div>
    </div>
  </div>

  <h2>second task---- create using internal css</h2>
  <div class="task2-box">
    <button class="btn btn-rounded">button</button>
    <button class="btn btn-oval">button</button>
    <button class="btn btn-circle">button</button>
    <button class="btn btn-rect">button</button>
  </div>

  <h2>Task-3--------------------------</h2>
  <div class="task3-outer-circle">
    <div class="task3-mid-circle">
      <div class="task3-inner-circle">
        <span class="circle-text">hiiiiii..</span>
      </div>
    </div>
  </div>

</body>
</html>
